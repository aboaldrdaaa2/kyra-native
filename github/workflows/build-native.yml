name: Build native tunnel (hev-socks5-tunnel)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch hev-socks5-tunnel
        run: |
          mkdir -p native/jni
          git clone --recursive --depth 1 https://github.com/heiher/hev-socks5-tunnel native/jni/hev-socks5-tunnel
          echo 'include $(call all-subdir-makefiles)' > native/jni/Android.mk
          cat > native/jni/Application.mk <<'MK'
          APP_OPTIM := release
          APP_PLATFORM := android-26
          APP_ABI := armeabi-v7a arm64-v8a
          APP_CFLAGS := -O3 -DPKGNAME=abbadeh/apps/kyravpn -DCLSNAME=TProxyService
          APP_CPPFLAGS := -O3 -std=c++11
          NDK_TOOLCHAIN_VERSION := clang
          MK

      - name: Build with NDK
        run: |
          "$ANDROID_NDK_HOME/ndk-build" -C native \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk
          find native/libs -name '*.so'

      - uses: actions/upload-artifact@v4
        with:
          name: jniLibs
          path: native/libs
